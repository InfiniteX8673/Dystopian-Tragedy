<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dystopian Tragedy - Home</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo 1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="main.js" defer></script>
</head>
<body>

<header>
    <a href="index.html" class="logo">Dystopian Tragedy</a>
    <nav>
        <a href="index.html" class="active-nav">Home</a>
        <a href="about.html">About</a>
        <a href="features.html">Features</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
        <a href="downloads.html" class="nav-cta">Download</a>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    </div>
</header>

<div class="hero">
    <div class="hero-content">
        <h1>Dystopian Tragedy</h1>
        <p>A choice-driven action game set in a dark cyberpunk world. Hack, fight, and navigate a city on the brink.</p>
        <div class="hero-actions">
            <a href="downloads.html" class="btn btn-primary">Download</a>
            <a href="features.html" class="btn btn-outline">Learn More</a>
        </div>
    </div>
</div>

<main>
<section>
    <h2>Trailer</h2>
    <div class="video-container">
        <video controls preload="metadata" poster="Gallery/screenshot1.png">
            <source src="trailer.mp4" type="video/mp4">
            Your browser does not support the HTML5 video tag.
        </video>
    </div>
</section>

<section>
    <h2>Screenshots</h2>
    <div class="screenshots">
        <img src="Gallery/screenshot1.png" alt="Screenshot 1">
        <img src="Gallery/screenshot2.png" alt="Screenshot 2">
        <img src="Gallery/screenshot3.png" alt="Screenshot 3">
        <img src="Gallery/screenshot4.png" alt="Screenshot 4">
        <img src="Gallery/screenshot5.png" alt="Screenshot 5">
    </div>
</section>
</main>

<footer>
    <div class="footer-inner">
        <p>&copy; 2026 Dystopian Tragedy</p>
        <div class="socials">
            <a href="https://www.youtube.com/@DystopianTragedy" target="_blank" rel="noreferrer noopener" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://discord.gg/QwyYQe82" target="_blank" rel="noreferrer noopener" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        </div>
    </div>
</footer>

<div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <button class="nav-btn prev-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="nav-btn next-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
    <img class="modal-content" id="modalImage" alt="Screenshot preview">
    <div class="image-counter" id="imageCounter"></div>
</div>

</body>
</html>
