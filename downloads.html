<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads - Dystopian Tragedy</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo 1.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="main.js" defer></script>
</head>
<body>

<header>
    <a href="index.html" class="logo">Dystopian Tragedy</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="features.html">Features</a>
        <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
        <a href="downloads.html" class="nav-cta">Download</a>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
    </div>
</header>

<div class="hero hero-sm">
    <div class="hero-content">
        <h1>Download</h1>
    </div>
</div>

<main>
<section>
    <h2>Select Platform</h2>
    <div class="platform-selector">
        <button id="windows-btn" class="platform-btn active" onclick="selectPlatform('windows')"><i class="fa-brands fa-windows"></i> Windows</button>
        <button id="linux-btn" class="platform-btn" onclick="selectPlatform('linux')"><i class="fa-brands fa-linux"></i> Linux</button>
    </div>

    <div class="download-content">
        <div id="windows-download" class="platform-download active">
            <h4>Windows</h4>
            <p class="version-info">vBeta 0.1</p>
            <a class="download-btn" href="https://www.mediafire.com/file/k9d2wym1n3ft4fa/windows.zip/file" target="_blank" rel="noreferrer noopener">
                <i class="fa-solid fa-download"></i> Download
            </a>
        </div>
        <div id="linux-download" class="platform-download">
            <h4>Linux</h4>
            <p class="version-info">vBeta 0.1</p>
            <a class="download-btn" href="https://www.mediafire.com/file/940tvfnw1hmarn3/Linux.zip/file" target="_blank" rel="noreferrer noopener">
                <i class="fa-solid fa-download"></i> Download
            </a>
        </div>
    </div>
</section>
</main>

<footer>
    <div class="footer-inner">
        <p>&copy; 2026 Dystopian Tragedy</p>
        <div class="socials">
            <a href="https://www.youtube.com/@DystopianTragedy" target="_blank" rel="noreferrer noopener" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://discord.gg/QwyYQe82" target="_blank" rel="noreferrer noopener" aria-label="Discord"><i class="fa-brands fa-discord"></i></a>
        </div>
    </div>
</footer>

<script>
function selectPlatform(platform) {
    var btns = document.querySelectorAll('.platform-btn');
    var downloads = document.querySelectorAll('.platform-download');
    btns.forEach(function(b) { b.classList.remove('active'); });
    downloads.forEach(function(d) { d.classList.remove('active'); });
    document.getElementById(platform + '-btn').classList.add('active');
    document.getElementById(platform + '-download').classList.add('active');
}
</script>

</body>
</html>
